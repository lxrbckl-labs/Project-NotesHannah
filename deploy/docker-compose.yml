# Run from the repository root:  docker compose -f deploy/docker-compose.yml up --build
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: notes-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
      DB_PATH: /db/notes.db
    volumes:
      # Live database on a named volume (SQLite on bind mounts is risky).
      - notes-db:/db
      # Originals and page images on the host (external drive in production).
      - "${DATA_DIR:-./data}:/data"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  notes-db:
